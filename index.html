<script>

const kosar = {};
const NAPI_AR = 1400;
const HETI_KEDVEZMENY = 0.10;
let dbSzam = 0;

const URL = "https://script.google.com/macros/s/AKfycbw0HaGuas8Xr9zjM90DtZFrjdjMRjwzK1b3SIyP_XiMxsin2d9D8aLkrL9xKxIxagVR/exec";


function kezelTanar(){

    const tanar = document.getElementById("tanarE").checked;
    const ev = document.getElementById("diakEvfolyam");
    const betu = document.getElementById("diakBetujel");
    const osztalySor = document.getElementById("osztalySor");

    ev.disabled = tanar;
    betu.disabled = tanar;

    if(tanar){

        ev.value = "";
        betu.value = "";

        osztalySor.classList.add("tanar-aktiv");

    }else{

        osztalySor.classList.remove("tanar-aktiv");

    }

}


/* =========================================================
   NAP KIVÁLASZTÁSA
   ========================================================= */

function setKivalasztva(gomb, datum, menu){

    if(kosar[datum]){

        delete kosar[datum];

        gomb.setAttribute("data-db","0");

        gomb.classList.remove("kivalasztva");

        gomb.innerText = "Kérem";

    }else{

        const napSzekcio = gomb.closest(".nap-szekcio");

        kosar[datum] = {

            /* JAVÍTÁS:
               a dátumot is eltároljuk,
               mert az alsó összesítő és a rendelésküldés használja
            */

            datum: datum,

            nap: napSzekcio.dataset.nap,

            het: napSzekcio.dataset.het,

            menu: menu

        };

        gomb.setAttribute("data-db","1");

        gomb.classList.add("kivalasztva");

        gomb.innerText = "Kiválasztva";

    }

    frissitOsszesito();

}


/* =========================================================
   NORMÁL MENÜ
   ========================================================= */

function kb(gomb, datum, nap, menu){

    setKivalasztva(
        gomb,
        datum,
        menu
    );

}


/* =========================================================
   GYROS + PALACSINTA
   ========================================================= */

function pentekiMenu(gomb, datum, nap){

    const csipos =
        document.getElementById("gyrosCsipos").checked;

    const palacsinta =
        document.getElementById("palacsintaIz").value;


    if(!palacsinta){

        alert(
            "Kérlek válaszd ki a palacsinta ízét!"
        );

        return;

    }


    let menu = "Gyros tál";


    if(csipos){

        menu += " (csípős)";

    }


    menu +=
        " + Palacsinta (2 db) - " +
        palacsinta;


    setKivalasztva(
        gomb,
        datum,
        menu
    );

}


/* =========================================================
   TEJBERIZS
   ========================================================= */

function tejberizsMenu(gomb, datum, nap){

    const iz =
        document.getElementById("tejberizsIz").value;


    if(!iz){

        alert(
            "Kérlek válaszd ki a tejberizs ízét!"
        );

        return;

    }


    const menu =
        "Borsófőzelék kolbásszal + Tejberizs - " +
        iz;


    setKivalasztva(
        gomb,
        datum,
        menu
    );

}


/* =========================================================
   PIZZA
   ========================================================= */

function pizzaMenu(gomb, datum, nap){

    const iz =
        document.getElementById("pizzaIz").value;


    if(!iz){

        alert(
            "Kérlek válaszd ki a pizza típusát!"
        );

        return;

    }


    const menu =
        "Tárkonyos raguleves + Fél pizza - " +
        iz;


    setKivalasztva(
        gomb,
        datum,
        menu
    );

}


/* =========================================================
   RENDELÉSI HATÁRIDŐ
   ========================================================= */

function elozoSzerda(hetDatum){

    const d =
        new Date(
            hetDatum + "T00:00:00"
        );


    d.setDate(
        d.getDate() - 5
    );


    d.setHours(
        23,
        59,
        59,
        999
    );


    return d;

}


/* =========================================================
   GOMBOK ÁLLAPOTA
   ========================================================= */

function frissitGombok(){

    const most =
        new Date();


    document
        .querySelectorAll(".heti-blokk")
        .forEach(function(het){


            const elsoNap =
                het.querySelector(
                    ".nap-szekcio"
                );


            if(!elsoNap){

                return;

            }


            const hetDatum =
                elsoNap.dataset.het;


            const hatarido =
                elozoSzerda(
                    hetDatum
                );


            const lezart =
                most > hatarido;


            het
                .querySelectorAll(
                    ".hozzaad-gomb"
                )
                .forEach(function(gomb){


                    const datum =
                        gomb
                            .closest(
                                ".nap-szekcio"
                            )
                            .dataset
                            .datum;


                    if(lezart){

                        gomb.disabled = true;

                        gomb.innerText =
                            "Lezárva";

                    }else if(kosar[datum]){

                        gomb.disabled = false;

                        gomb.innerText =
                            "Kiválasztva";

                    }

                });

        });

}


/* =========================================================
   ALSÓ RENDELÉSI ÖSSZESÍTŐ
   ========================================================= */

function frissitOsszesito(){

    const rendelesek =
        Object.values(kosar);


    dbSzam =
        rendelesek.length;


    const alapAr =
        rendelesek.length *
        NAPI_AR;


    let kedvezmeny = 0;


    /* -----------------------------------------------------
       A 10% KEDVEZMÉNY CSAK TELJES 5 NAPOS HÉTRE JÁR
       ----------------------------------------------------- */


    const hetek = {};


    rendelesek.forEach(function(r){

        if(!hetek[r.het]){

            hetek[r.het] = [];

        }


        hetek[r.het].push(r);

    });


    Object
        .keys(hetek)
        .forEach(function(hetDatum){


            const hetNapjai =
                Array.from(

                    document.querySelectorAll(

                        '.nap-szekcio[data-het="' +
                        hetDatum +
                        '"]'

                    )

                );


            /*
             Csak olyan hét kaphat kedvezményt,
             amelyik ténylegesen 5 napos.
            */

            if(hetNapjai.length !== 5){

                return;

            }


            const rendelhetoDatumok =
                hetNapjai.map(
                    function(nap){

                        return nap.dataset.datum;

                    }
                );


            const kivalasztottDatumok =
                hetek[hetDatum].map(
                    function(r){

                        return r.datum;

                    }
                );


            const teljesHet =
                rendelhetoDatumok.every(
                    function(datum){

                        return kivalasztottDatumok.includes(
                            datum
                        );

                    }
                );


            if(teljesHet){

                kedvezmeny +=
                    5 *
                    NAPI_AR *
                    HETI_KEDVEZMENY;

            }

        });


    const vegosszeg =
        alapAr -
        kedvezmeny;


    /* -----------------------------------------------------
       KIVÁLASZTOTT NAPOK DÁTUM SZERINT
       ----------------------------------------------------- */


    const rendelesekDatumSzerint =
        rendelesek
            .slice()
            .sort(
                function(a,b){

                    return a.datum.localeCompare(
                        b.datum
                    );

                }
            );


    const napokSzoveg =
        rendelesekDatumSzerint.length

        ?

        rendelesekDatumSzerint
            .map(
                function(r){


                    const rovidNap = {

                        "Hétfő": "H",

                        "Kedd": "K",

                        "Szerda": "Sz",

                        "Csütörtök": "Cs",

                        "Péntek": "P"

                    }[r.nap] || r.nap;


                    const datumResz =
                        r.datum.split("-");


                    const honap =
                        datumResz[1];


                    const nap =
                        datumResz[2];


                    return (
                        honap +
                        "." +
                        nap +
                        ". " +
                        "<span class='rovid-nap'>" +
                        "(" +
                        rovidNap +
                        ")" +
                        "</span>"
                    );

                }
            )
            .join(", ")

        :

        "nincs kiválasztott nap";


    let szoveg =

        "Kiválasztva: " +

        "<span class='kivalasztott-lista'>" +

        napokSzoveg +

        "</span>" +

        " | Végösszeg: " +

        vegosszeg.toLocaleString(
            "hu-HU"
        ) +

        " Ft";


    if(kedvezmeny > 0){

        szoveg +=

            " (" +

            kedvezmeny.toLocaleString(
                "hu-HU"
            ) +

            " Ft kedvezménnyel)";

    }


    const kd =
        document.getElementById("kd");


    if(kd){

        kd.innerHTML =
            szoveg;

    }

}


/* =========================================================
   RENDELÉS VÉGLEGESÍTÉSE
   ========================================================= */

function kl(){

    const nev =
        document
            .getElementById("diakNev")
            .value
            .trim();


    const email =
        document
            .getElementById("diakEmail")
            .value
            .trim();


    const evfolyam =
        document
            .getElementById("diakEvfolyam")
            .value;


    const betujel =
        document
            .getElementById("diakBetujel")
            .value;


    const tanar =
        document
            .getElementById("tanarE")
            .checked;


    const gomb =
        document
            .getElementById("bg");


    /* -----------------------------------------------------
       ELLENŐRZÉSEK
       ----------------------------------------------------- */


    if(!nev || !email){

        alert(
            "Kérlek töltsd ki a nevet és az e-mail címet!"
        );

        return;

    }


    if(
        !tanar &&
        (
            !evfolyam ||
            !betujel
        )
    ){

        alert(
            "Kérlek válaszd ki az évfolyamodat és a betűjeledet!"
        );

        return;

    }


    if(dbSzam === 0){

        alert(
            "Kérlek válassz legalább egy napot!"
        );

        return;

    }


    if(
        !email.includes("@") ||
        !email.includes(".")
    ){

        alert(
            "Kérlek adj meg egy érvényes e-mail címet!"
        );

        return;

    }


    const osztalyNev =
        tanar

        ?

        "Tanár"

        :

        evfolyam +
        "." +
        betujel;


    gomb.innerText =
        "Küldés...";


    gomb.disabled =
        true;


    /* -----------------------------------------------------
       RENDELÉSEK HETEKRE BONTÁSA
       ----------------------------------------------------- */


    const hetek = {};


    Object
        .values(kosar)
        .forEach(
            function(r){


                if(!hetek[r.het]){

                    hetek[r.het] = [];

                }


                hetek[r.het].push(r);

            }
        );


    const hetLista =
        Object.keys(hetek);


    /* -----------------------------------------------------
       MINDEN HÉT KÜLÖN SORKÉNT MEGY A GOOGLE SHEETBE
       ----------------------------------------------------- */


    hetLista.forEach(
        function(hetDatum, index){


            const mezok = {

                nev: nev,

                email: email,

                osztaly: osztalyNev,

                hetDatum: hetDatum,

                hetfo: "",

                kedd: "",

                szerda: "",

                csutortok: "",

                pentek: "",

                hetfoDatum: "",

                keddDatum: "",

                szerdaDatum: "",

                csutortokDatum: "",

                pentekDatum: ""

            };


            hetek[hetDatum]
                .forEach(
                    function(r){


                        const mezokKulcsai = {

                            "Hétfő": [
                                "hetfo",
                                "hetfoDatum"
                            ],

                            "Kedd": [
                                "kedd",
                                "keddDatum"
                            ],

                            "Szerda": [
                                "szerda",
                                "szerdaDatum"
                            ],

                            "Csütörtök": [
                                "csutortok",
                                "csutortokDatum"
                            ],

                            "Péntek": [
                                "pentek",
                                "pentekDatum"
                            ]

                        }[r.nap];


                        if(mezokKulcsai){

                            mezok[
                                mezokKulcsai[0]
                            ] = r.menu;


                            mezok[
                                mezokKulcsai[1]
                            ] = r.datum;

                        }

                    }
                );


            /* -------------------------------------------------
               REJTETT IFRAME
               ------------------------------------------------- */


            const iframe =
                document.createElement(
                    "iframe"
                );


            iframe.name =
                "rendelesIframe_" +
                index;


            iframe.style.display =
                "none";


            document.body.appendChild(
                iframe
            );


            /* -------------------------------------------------
               FORM
               ------------------------------------------------- */


            const form =
                document.createElement(
                    "form"
                );


            form.method =
                "POST";


            form.action =
                URL;


            form.target =
                iframe.name;


            form.style.display =
                "none";


            /* -------------------------------------------------
               ADATMEZŐK
               ------------------------------------------------- */


            Object
                .keys(mezok)
                .forEach(
                    function(kulcs){


                        const input =
                            document.createElement(
                                "input"
                            );


                        input.type =
                            "hidden";


                        input.name =
                            kulcs;


                        input.value =
                            mezok[kulcs];


                        form.appendChild(
                            input
                        );

                    }
                );


            document.body.appendChild(
                form
            );


            form.submit();

        }
    );


    /* -----------------------------------------------------
       SIKERES RENDELÉS ABLAK
       ----------------------------------------------------- */


    setTimeout(
        function(){

            document
                .getElementById(
                    "sikerModal"
                )
                .style
                .display =
                "flex";

        },

        2000

    );

}


/* =========================================================
   OLDAL BETÖLTÉSE
   ========================================================= */

window.addEventListener(
    "load",
    function(){

        kezelTanar();

        frissitGombok();

        frissitOsszesito();

    }
);

</script>
